<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🍌💥 無限名言バナナスカウター v53.0 💥🍌</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@latest"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #080c10;
      color: #ffd700;
      font-family: monospace, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
      min-height: 100vh;
      overflow-x: hidden;
    }
    h1 {
      font-size: 1.05rem;
      margin: 4px 0 8px;
      color: #ffd700;
      text-shadow: 0 0 10px #ff9900, 0 0 5px #ffd700;
      letter-spacing: 2px;
    }
    .scouter-view {
      position: relative;
      width: 100%;
      max-width: 360px;
      height: 480px;
      border-radius: 20px;
      overflow: hidden;
      background: #000;
      border: 3px solid #ffd700;
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.4);
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    canvas#scouter-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .hud-banner {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      background: rgba(20, 15, 0, 0.88);
      border: 1px solid #ffd700;
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 0.82rem;
      font-weight: 900;
      color: #ffd700;
      text-shadow: 0 0 5px #ffd700;
      text-align: center;
      z-index: 5;
      line-height: 1.4;
      box-shadow: 0 0 10px rgba(255,215,0,0.3);
    }
    .hud-grid {
      position: absolute;
      inset: 0;
      background: linear-gradient(rgba(255,215,0,0.05) 1px, transparent 1px),
                  linear-gradient(90deg, rgba(255,215,0,0.05) 1px, transparent 1px);
      background-size: 20px 20px;
      pointer-events: none;
    }
    .btn-start {
      margin-top: 14px;
      width: 100%;
      max-width: 360px;
      padding: 14px;
      font-size: 1.1rem;
      font-weight: 900;
      background: linear-gradient(135deg, #ffcc00 0%, #ff3300 100%);
      color: #fff;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 100, 0, 0.6);
      letter-spacing: 2px;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.6);
    }
    .btn-start:active { transform: scale(0.97); }
  </style>
</head>
<body>

  <h1>🍌 無限名言バナナスカウター v53.0 🍌</h1>

  <div class="scouter-view">
    <video id="video" autoplay playsinline></video>
    <div class="hud-grid"></div>
    <div id="hud-banner" class="hud-banner">📡 スカウター起動待機中…</div>
    <canvas id="scouter-overlay"></canvas>
  </div>

  <canvas id="crop-canvas" width="40" height="40" style="display:none;"></canvas>

  <button id="start-btn" class="btn-start" onclick="initScouter()">💥 無限名言スカウター起動！！</button>

  <script>
    // 🕵️ 無限掛け合わせスロット辞書（Base64暗号化）
    const _SLOTS = {
      // 完熟用パーツ（A x B x C で数万通り）
      R_A: ["56eB44Gu5oim6ZeY5Yqb44GvNTMwMDAw44CC", "6KaL44KN77yB", "5oiR44GM55Sf5rav44Gr44CB", "44GK5YmN44Gv44KC44GG44CB", "5pyA6auY44Gr44CO44OP44Kk77yB44CP44Gj44Gm44CB", "56yR44GI44Gw44GE44GE44Go5oCd44GG44CB", "5aSp5omN44Gg44GL44KJ44CB", "5bem5omL44Gv5re744GI44KL44Gg44GR44CB", "44Kq44Os44Gv5LuK44Gq44KT44Gg44CB", "5pyI44Gr5Luj44KP44Gj44Gm44CB", "5Yud5Yip44Gu5rOV5YmH44Gv44CB", "44GT44GT44GL44KJ44Gv44CB", "55SY44GV44GM44CB", "44GK44Gw44GC44Gh44KD44KT44GM6KiA44Gj44Gm44GE44Gf44CB"],
      R_B: ["44K344Ol44Ks44O844K544Od44OD44OI44GM54af44GN6YCa44KK44CB", "5a6M54af44Gu5qW144Gr6YGU44GX44CB", "56We44Gu6aGY5Z+f44Gr6YGU44GX44CB", "55SY44GV44GM44GC44G144KM5Ye644Gm44CB", "6aOf44G56aCD44OU44O844Kv44Gr6YGU44GX44CB", "5by36ICF44Gu6aaZ5rCX44KS5pS+44Gh44CB", "6auY5qCh55Sf44GM44Gq44KB44KL55SY44GV44Gn44CB", "54af44GN5pyb44Gu44Km44Os44Km44Os44Gn44CB"],
      R_C: ["5LiA54mH44Gu5oKUI44Gq44GX77yB", "55qu44KS44KA44GP44KT44Gg77yB", "55SY44KE44GL44GX44Gm44KI77yB", "5YWo6aOf44GX44Gm44KE44KL44Gc77yB", "5aSp44Gu6YGT44KS5b6A44GP77yB", "5pyJ5ZCN5Y6f44Go44Gq44KL77yB", "44K044Of44Gu44KI44GG44Gg77yB", "5LuK44GZ44GQ6aOf44GI77yB"],

      // 未熟用パーツ
      U_A: ["5oim6ZeY5Yqb44CA44Gf44Gj44Gf44GuNeOBi+KApuOCtOODn+OCgQ==", "44GK5YmN44Gu44KI44GG44Gq6Z2S44OQ44OK44OK44Gv44CB", "6YCA44Gs44GZX77yB5aqa44Gz44GZX77yB", "54Sh6aeE54Sh6aeE54Sh6aeE44OD77yB", "44OR44K/44O844Oz6Z2S44CB", "44GC44KT44Gf44OQ44Kr44Kh77yf", "44GT44KT44Gq5ZGz44Gu5pmC44CB", "5a6J6KW/5YWI55Sf44CB", "44Oq44Custom44Km44Oz44OJ44KS5Yi244GZ44Kq44O844Gv44CB", "6LK05qeY44CB", "44OA44Oh44Gg44CB", "5bm+5ben44Gj44Gm5aW044Gu5LuV5qWt44Gn44CB"],
      U_B: ["56Gs44GZ44GO44Gm77yh77yULuODleOCo+ODvOODq+ODieOCkueVs+WSjOOBl+OBjeOBmu44CB", "5riL44G/44GM5ZC444KP44KM44CB", "6Ieq5YiG6Ieq6Lqr44Gu6Iul44GV44KG44GI44Gr6L+344KK44CB", "6aOf44GI44KL44KP44GR44Gq44GE44GY44KD44Gq44GP44CB", "5LiJ5LqV44Gu44KI44GG44Gr5p6h44KM44CB", "5byx6ICF44Gu44G+44G+44Gn44CB", "5b6M5q6144G444GZ44KK44CB", "6Z2S5rGB44Gu5ZGz44GM44GX44Gm44CB"],
      U_C: ["6L+954af57WC5LqG44Gn44GZ44CC", "44Kp44K344GK44GN44KI77yB", "44Gp44KT44Gq6aZT44KS44GZ44KM44Gw44GE44GE44GL57W244GL44KT44CC", "5qqq44G444Gf44GP44Gq44GE77yB", "5LiJ5pel5a+d44GL44Gb77yB", "6YCA44GP44Ge77yB", "57WC44KP44KT44KI44CC", "5p2+5Lul5LiK44Gu5riL44GV44Gg77yB"],

      // 標準用パーツ（超大増量）
      N_A: ["55uu5qiZ44KS44K744Oz44K/44O844Gr5YWl44KM44Gm44CB", "6Kaa5oKf44Gv44GE44GE44GL77yf", "44Kq44Os44Gr5LuK44Gn44GN44KL44GT44Go44Gv44CB", "5pat44GT44Gf44KL5rG65Y2Y44Gn44CB", "5rWB44KM44Gv6Ieq5YiG44Gf44Gh44Gn5oyB44Gj44Gm44GP44KL44CA", "6JC944Gh44Gk44GR44CB", "44GT44GT44Gn44GK5YmN44GM6aOf44KP44Gq44GN44KD44CB", "5pmu6YCa44Gu44OQ44OK44OK44Gg44GM44CB", "5LqL5Lu244Gv44CB", "5b6A44GN44Gv44CB", "55qu44KS44KA44GE44Gf44KJ44CB", "5rG644G+44Gj44Gf44CB"],
      N_B: ["5rex5ZG85ZC444GX44Gm44CB", "44K544Kk44OD44OB44KS5oq844GX44CB", "5biM5pyb44KS5o2o44Gm44Ga44CB", "44OQ44OK44OK44K544K/44Oz44OJ44GL44KJ44CB", "5pmu6YCa44Gr6aOf44G544KL44Gf44KB44Gr44CB", "5q2j6KaP44Gu6aOf44G56aCD44Gn44CB", "44Op44Kk44OV44K544K/44Kk44Or44KS5Y+X44GR5YWl44KM44CB", "6Kmw44GM6aOf44GP44KT44Gg44CB", "44OT44Op44OB44OG44Kj44Gu576p5b6h44Gr44CB"],
      N_C: ["55qu44KS44KA44GP44CC", "44Gd44KM44GM44GE44GE44CC", "6aOf44G544KL44Go5oCd44GI44CC", "44Kq44Os44Gv44Gn44GN44Gm44KL77yB", "5LiA5Y+j6aOf44G544Gm44G/44KN44Gf44G+44GI44CC", "5q2j6KaP44Gu5ZGz44Gg77yB", "5qih56+E55qE44Gq5ZGz44Gg44CC", "44GL44GI44Gk44GK44Gt44GN44KM44Gf77yB"]
    };

    function decodeArr(arr) {
      return arr.map(str => decodeURIComponent(escape(atob(str))));
    }

    const POOL = {
      R_A: decodeArr(_SLOTS.R_A), R_B: decodeArr(_SLOTS.R_B), R_C: decodeArr(_SLOTS.R_C),
      U_A: decodeArr(_SLOTS.U_A), U_B: decodeArr(_SLOTS.U_B), U_C: decodeArr(_SLOTS.U_C),
      N_A: decodeArr(_SLOTS.N_A), N_B: decodeArr(_SLOTS.N_B), N_C: decodeArr(_SLOTS.N_C)
    };

    function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

    // 無限スロット生成エンジン
    function generateInfiniteLine(type) {
      if (type === 'ripe') return pick(POOL.R_A) + pick(POOL.R_B) + pick(POOL.R_C);
      if (type === 'unripe') return pick(POOL.U_A) + pick(POOL.U_B) + pick(POOL.U_C);
      return pick(POOL.N_A) + pick(POOL.N_B) + pick(POOL.N_C);
    }

    let model = null;
    let video = document.getElementById('video');
    let overlay = document.getElementById('scouter-overlay');
    let ctx = overlay.getContext('2d');
    let banner = document.getElementById('hud-banner');
    let cropCanvas = document.getElementById('crop-canvas');
    let cropCtx = cropCanvas.getContext('2d', { willReadFrequently: true });
    let isRunning = false;
    let audioCtx = null;
    let lastSpokenTime = 0;

    function playBeep(freq, type, duration) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    function speakScouter(text) {
      if (!('speechSynthesis' in window)) return;
      const now = Date.now();
      if (now - lastSpokenTime < 4200) return;
      lastSpokenTime = now;

      window.speechSynthesis.cancel();
      const cleanText = text.replace(/[（）()！!]/g, '、');
      const uttr = new SpeechSynthesisUtterance(cleanText);
      uttr.lang = 'ja-JP';
      uttr.rate = 1.25;
      uttr.pitch = 1.05;
      window.speechSynthesis.speak(uttr);
    }

    async function initScouter() {
      const btn = document.getElementById('start-btn');
      btn.style.display = 'none';
      banner.innerText = '🧠 無限構文解析エンジン起動中…';

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" } },
          audio: false
        });
        video.srcObject = stream;
        await video.play();

        model = await cocoSsd.load();
        banner.innerText = '🟢 TARGET SEARCHING... バナナにかざせ！';
        isRunning = true;
        requestAnimationFrame(renderLoop);
      } catch (err) {
        banner.innerText = '❌ エラー: ' + err.message;
      }
    }

    function rgbToHsv(r, g, b) {
      r /= 255; g /= 255; b /= 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      let h, s, v = max;
      const d = max - min;
      s = max === 0 ? 0 : d / max;
      if (max === min) h = 0;
      else {
        switch (max) {
          case r: h = (g - b) / d + (g < b ? 6 : 0); break;
          case g: h = (b - r) / d + 2; break;
          case b: h = (r - g) / d + 4; break;
        }
        h /= 6;
      }
      return [h * 360, s * 100, v * 100];
    }

    async function renderLoop() {
      if (!isRunning) return;

      overlay.width = video.videoWidth;
      overlay.height = video.videoHeight;
      ctx.clearRect(0, 0, overlay.width, overlay.height);

      if (model && video.readyState >= 2) {
        const predictions = await model.detect(video);
        const bananas = predictions.filter(p => p.class === 'banana' && p.score > 0.35);

        if (bananas.length > 0) {
          playBeep(920 + Math.random() * 300, 'square', 0.025);

          let maxPower = 0;
          let bestLine = '';

          bananas.forEach(b => {
            const [x, y, w, h] = b.bbox;
            cropCtx.drawImage(video, x, y, w, h, 0, 0, 40, 40);
            const imgData = cropCtx.getImageData(0, 0, 40, 40).data;

            let green = 0, spot = 0, yellow = 0, total = 0;
            for (let i = 0; i < imgData.length; i += 4) {
              const [hv, s, v] = rgbToHsv(imgData[i], imgData[i+1], imgData[i+2]);
              total++;
              if (hv >= 45 && hv <= 155 && s > 18) green++;
              else if (hv >= 10 && hv < 32 && s > 40 && v < 35) spot++;
              else yellow++;
            }

            const gRatio = green / total;
            const sRatio = spot / total;

            let power = 15000;
            let status = '普通';
            let line = generateInfiniteLine('normal');

            if (gRatio > 0.25) {
              power = Math.floor(5 + Math.random() * 45);
              status = '使徒・ゴミめ（未熟）';
              line = generateInfiniteLine('unripe');
            } else if (sRatio > 0.15) {
              power = 530000;
              status = '覇権・完熟神！';
              line = generateInfiniteLine('ripe');
            }

            if (power > maxPower) {
              maxPower = power;
              bestLine = line;
            }

            drawScouterTarget(b.bbox, power, status, power === 530000);
          });

          banner.innerHTML = `📡 捕捉: ${bananas.length}本 | 最高POWER: ${maxPower.toLocaleString()}<br><b>💬「${bestLine}」</b>`;
          speakScouter(bestLine);
        } else {
          banner.innerText = '📡 SEARCHING... スーパーのバナナ売り場に向けろ！';
        }
      }

      requestAnimationFrame(renderLoop);
    }

    function drawScouterTarget(bbox, power, status, isMax) {
      const [x, y, w, h] = bbox;
      const color = isMax ? '#FF0055' : (power < 100 ? '#00FF66' : '#FFD700');

      ctx.strokeStyle = color;
      ctx.lineWidth = isMax ? 4 : 2;
      ctx.shadowColor = color;
      ctx.shadowBlur = isMax ? 18 : 6;

      const len = Math.min(w, h) * 0.2;
      ctx.beginPath();
      ctx.moveTo(x, y + len); ctx.lineTo(x, y); ctx.lineTo(x + len, y);
      ctx.moveTo(x + w - len, y); ctx.lineTo(x + w); ctx.lineTo(x + w, y + len);
      ctx.moveTo(x, y + h - len); ctx.lineTo(x, y + h); ctx.lineTo(x + len, y + h);
      ctx.moveTo(x + w - len, y + h); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w, y + h - len);
      ctx.stroke();

      ctx.fillStyle = color;
      ctx.font = 'bold 15px monospace';
      ctx.fillText(`POWER: ${power.toLocaleString()}`, x, y - 8 > 16 ? y - 8 : y + h + 18);
    }
  </script>
</body>
</html>
