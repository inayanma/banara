<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🍌✨ きゃわわ♡バナナ＆お好み焼きスキャナー ✨🥞</title>
  <!-- TensorFlow.js & MobileNet CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@latest"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(circle, #fff0f5 0%, #ffe4ec 50%, #ffd1dc 100%);
      color: #5c3d46;
      font-family: "Hiragino Maru Gothic ProN", "Rounded Mplus 1c", -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
      min-height: 100vh;
      overflow-x: hidden;
    }
    
    .title-area {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 4px 0 8px;
    }
    h1 {
      font-size: 1.2rem;
      margin: 0;
      color: #ff4081;
      text-shadow: 2px 2px 0 #fff;
    }
    .banana-icon {
      font-size: 1.6rem;
      animation: swing 2s ease-in-out infinite alternate;
      display: inline-block;
    }
    @keyframes swing {
      0% { transform: rotate(-15deg); }
      100% { transform: rotate(15deg) scale(1.1); }
    }

    .mode-selector {
      display: flex;
      background: #ffffff;
      border-radius: 30px;
      padding: 4px;
      margin-bottom: 8px;
      width: 100%;
      max-width: 320px;
      box-shadow: 0 4px 15px rgba(255, 105, 180, 0.25);
      border: 2px solid #ffccd7;
    }
    .mode-btn {
      flex: 1;
      padding: 8px;
      font-size: 0.9rem;
      font-weight: 900;
      border: none;
      background: transparent;
      color: #b08d96;
      border-radius: 25px;
      cursor: pointer;
      transition: 0.2s all;
    }
    .mode-btn.active {
      background: linear-gradient(135deg, #ff6b9d 0%, #ff8dae 100%);
      color: #fff;
      box-shadow: 0 3px 8px rgba(255, 107, 157, 0.4);
    }

    .camera-wrapper {
      position: relative;
      width: 100%;
      max-width: 320px;
      height: 290px;
      border-radius: 28px;
      overflow: hidden;
      background: #333;
      border: 5px solid #fff;
      box-shadow: 0 8px 24px rgba(255, 105, 180, 0.2);
    }
    video, canvas#snapshot {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .guide-frame {
      position: absolute;
      top: 15%;
      left: 15%;
      width: 70%;
      height: 70%;
      border: 3px dashed #ff8dae;
      border-radius: 20px;
      pointer-events: none;
      box-shadow: inset 0 0 15px rgba(255, 141, 174, 0.4);
    }

    /* 飛び回る要素コンテナ */
    .bouncing-pack {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      display: none;
      white-space: nowrap;
      text-align: center;
    }
    .bouncing-banana {
      font-size: 3.5rem;
      display: block;
      filter: drop-shadow(0 8px 15px rgba(255, 105, 180, 0.5));
    }
    .bouncing-score-text {
      font-size: 3.2rem;
      font-weight: 900;
      color: #ff1493;
      text-shadow: 3px 3px 0 #fff, -3px -3px 0 #fff, 3px -3px 0 #fff, -3px 3px 0 #fff, 0 6px 20px rgba(255, 20, 147, 0.5);
    }

    .card {
      position: relative;
      width: 100%;
      max-width: 320px;
      background: #ffffff;
      border-radius: 24px;
      padding: 14px 16px;
      margin-top: 10px;
      box-shadow: 0 6px 20px rgba(255, 182, 193, 0.3);
      border: 3px solid #fff5f7;
    }
    .score-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 52px;
    }
    .score-label {
      font-size: 0.85rem;
      font-weight: bold;
      color: #a37c86;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    
    .settled-score {
      font-size: 2.8rem;
      font-weight: 900;
      color: #ff2a70;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      text-shadow: 2px 2px 0 #ffe0e9;
    }

    .badge {
      display: inline-block;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 900;
      margin: 6px 0;
      background: #ffe3ee;
      color: #d81b60;
      border: 1px solid #ffccd7;
    }
    .desc {
      font-size: 0.86rem;
      color: #5c3d46;
      line-height: 1.5;
      background: #fff8fa;
      padding: 12px;
      border-radius: 16px;
      border-left: 5px solid #ff8dae;
      font-weight: 700;
    }
    .ai-tag {
      font-size: 0.72rem;
      color: #b08d96;
      margin-top: 4px;
    }

    .btn-group {
      margin-top: 10px;
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 320px;
    }
    .action-btn {
      flex: 1;
      padding: 13px;
      font-size: 1.05rem;
      font-weight: 900;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 107, 157, 0.3);
      transition: transform 0.1s;
    }
    .action-btn:active { transform: scale(0.96); }
    .btn-scan {
      background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
      color: #fff;
      text-shadow: 1px 1px 0 rgba(0,0,0,0.1);
    }
    .btn-retake {
      background: #f0e6ea;
      color: #6d555c;
      display: none;
    }
  </style>
</head>
<body>

  <div class="title-area">
    <span class="banana-icon">🍌</span>
    <h1>きゃわわ♡激辛スキャナー</h1>
    <span class="banana-icon" style="animation-delay: -1s;">🥞</span>
  </div>

  <div class="mode-selector">
    <button id="btn-mode-banana" class="mode-btn active" onclick="switchMode('banana')">🍌 バナナちゃん</button>
    <button id="btn-mode-okonomi" class="mode-btn" onclick="switchMode('okonomi')">🥞 お好み焼きさん</button>
  </div>

  <div class="camera-wrapper">
    <video id="video" autoplay playsinline></video>
    <canvas id="snapshot" style="display: none;"></canvas>
    <div id="guide" class="guide-frame"></div>
  </div>

  <!-- 飛び回るバナナ＆点数パック -->
  <div id="flying-pack" class="bouncing-pack">
    <span id="flying-emoji" class="bouncing-banana">🍌</span>
    <span id="flying-score" class="bouncing-score-text">0.0度</span>
  </div>

  <canvas id="calc-canvas" width="100" height="100" style="display:none;"></canvas>

  <div class="card">
    <div class="score-row">
      <span class="score-label" id="score-label">✨ すてーたす</span>
      <span id="static-score" class="settled-score">--</span>
    </div>
    <div id="badge" class="badge">AIじゅんびちゅう…🎀</div>
    <div id="desc" class="desc">枠のなかにターゲットをドン！とおさえてボタンをおしてね♡</div>
    <div id="ai-tag" class="ai-tag"></div>
  </div>

  <div class="btn-group">
    <button id="main-btn" class="action-btn btn-scan" onclick="handleAction()">📸 カメラをつける！</button>
    <button id="retake-btn" class="action-btn btn-retake" onclick="retake()">🔄 もう一回みる♡</button>
  </div>

  <script>
    let currentMode = 'banana';
    let stream = null;
    let net = null;
    let bounceAnimId = null;
    let bounceTimer = null;

    let posX = 50, posY = 50;
    let velX = 6, velY = 7;
    let scale = 1.0;
    let scaleGrowing = true;

    const video = document.getElementById('video');
    const snapCanvas = document.getElementById('snapshot');
    const calcCanvas = document.getElementById('calc-canvas');
    const calcCtx = calcCanvas.getContext('2d', { willReadFrequently: true });
    const guide = document.getElementById('guide');
    const badge = document.getElementById('badge');
    const desc = document.getElementById('desc');
    const aiTag = document.getElementById('ai-tag');
    const mainBtn = document.getElementById('main-btn');
    const retakeBtn = document.getElementById('retake-btn');
    const flyingPack = document.getElementById('flying-pack');
    const flyingScore = document.getElementById('flying-score');
    const flyingEmoji = document.getElementById('flying-emoji');
    const staticScore = document.getElementById('static-score');

    // きゃわわ激辛セリフAI辞書
    const DICTIONARY = {
      human: [
        { badge: '🍖 それ人間の手やろがいっ！', desc: '手や指をみせないで〜！AIちゃんも「それ人間の一部です」ってドン引きしてるよ？' },
        { badge: '🖐️ 人肉スキャンはだめ〜！', desc: 'バナナの皮かぶってから出直してきてね♡毛穴しかみえないよ！' },
        { badge: '🤦 誰のお手てですかー！', desc: '糖度なんかあるわけないじゃん！今すぐハンドクリームぬって寝て！' }
      ],
      banana_unripe: [
        { badge: '🤮 渋っっ！ガッチガチの草！', desc: '青汁よりしぶ〜い！かんだ瞬間きゅってなるやつ！ゴリラも窓からポイするレベルだよ！' },
        { badge: '🪵 木片かじってるのぉ？', desc: 'えぐみの暴力〜！お口の水分ぜんぶ持っていかれちゃうよ！3日ねかせてね♡' },
        { badge: '🥦 ほぼブロッコリーちゃん！', desc: 'くだもの名乗っちゃだめ！ただの繊維のカタマリ！あとで舌がザラザラになるよ！' }
      ],
      banana_ripe: [
        { badge: '🍯 蜜のきわみ！自壊寸前っ！', desc: '糖度バクハツ〜！あまあまパラダイス！今すぐおなかにシュートしてぇ！！' },
        { badge: '🔥 かんじゅく神降臨〜✨', desc: 'シュガースポット全開だよ！飲む液体スイーツ！今日ちゅうに食べてね♡' }
      ],
      banana_normal: [
        { badge: '🍌 ふつうのバナナちゃん。', desc: 'THE・ひょうじゅん！スーパーのチラシにのってる通りの無難なお味だよ〜。' },
        { badge: '😐 コメントに困る味…', desc: 'いちばんリアクションしづらい優等生！おいしく食べてあげてね♡' }
      ],
      okonomi_burnt: [
        { badge: '🚨 たんか警報！即死案件！', desc: '炭素れんせい完了〜！鉄板のこげ削り取ってどうするのっ！きゅうしゅつして！' },
        { badge: '🪨 まるで炭鉱の石ころ！', desc: 'にがみのダイナマイト！ガリガリ言ってあご外れちゃうよ〜！' }
      ],
      okonomi_perfect: [
        { badge: '🔥 神のやき加減！ゆうしょう！', desc: 'カリッふわの黄金比率だよ！マヨビームと青のりかけて今すぐ食べてぇ！！' },
        { badge: '🏆 鉄板の魔術師あらわる！', desc: '外サク中フワの極み！ビール持ってきてぇ！優勝決定〜✨' }
      ],
      okonomi_raw: [
        { badge: '💧 生焼け〜！もんじゃかよ！', desc: '中身ドロッドロだよ！今ひっくり返したら大惨事になっちゃう！さわらないで！' },
        { badge: '⏳ あせるな！まだ粉！', desc: 'まだ小麦粉ジュースだよ！じっくりフタして待つべし！' }
      ]
    };

    function pickRandom(list) {
      return list[Math.floor(Math.random() * list.length)];
    }

    // きゃわわ自然音声読み上げ（女性声＆ピッチ調整）
    function speakCute(spokenScore, text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();

      // 「度」は「ど」と平仮名にして誤読撲滅
      const utterText = `${spokenScore}！ ${text}`;
      const uttr = new SpeechSynthesisUtterance(utterText);
      uttr.lang = 'ja-JP';
      uttr.rate = 1.12;
      uttr.pitch = 1.35; // 高めのきゃわわトーン

      const voices = window.speechSynthesis.getVoices();
      const cuteVoice = voices.find(v => (v.name.includes('Google') || v.name.includes('Kyoko') || v.name.includes('Otoya') || v.name.includes('Nanami') || v.name.includes('Siri')) && v.lang.includes('ja'));
      if (cuteVoice) uttr.voice = cuteVoice;

      window.speechSynthesis.speak(uttr);
    }

    async function loadAI() {
      try {
        net = await mobilenet.load();
        badge.innerText = 'AIじゅんび完了！カメラつけてね✨';
      } catch (e) {
        badge.innerText = 'AIロード失敗（通常モードで動くよ）';
      }
    }
    loadAI();

    function switchMode(mode) {
      currentMode = mode;
      document.getElementById('btn-mode-banana').classList.toggle('active', mode === 'banana');
      document.getElementById('btn-mode-okonomi').classList.toggle('active', mode === 'okonomi');
      flyingEmoji.innerText = (mode === 'banana') ? '🍌' : '🥞';
      retake();
    }

    async function handleAction() {
      if (!stream) {
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: "environment" } },
            audio: false
          });
          video.srcObject = stream;
          mainBtn.innerText = '🔍 きゃわわスキャン開始！';
        } catch (e) {
          alert('カメラ許可エラーだよ: ' + e.message);
        }
      } else {
        runAnalysis();
      }
    }

    function rgbToHsv(r, g, b) {
      r /= 255; g /= 255; b /= 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      let h, s, v = max;
      const d = max - min;
      s = max === 0 ? 0 : d / max;
      if (max === min) {
        h = 0;
      } else {
        switch (max) {
          case r: h = (g - b) / d + (g < b ? 6 : 0); break;
          case g: h = (b - r) / d + 2; break;
          case b: h = (r - g) / d + 4; break;
        }
        h /= 6;
      }
      return [h * 360, s * 100, v * 100];
    }

    async function runAnalysis() {
      snapCanvas.width = video.videoWidth;
      snapCanvas.height = video.videoHeight;
      snapCanvas.getContext('2d').drawImage(video, 0, 0);

      video.style.display = 'none';
      snapCanvas.style.display = 'block';
      guide.style.display = 'none';
      mainBtn.style.display = 'none';
      retakeBtn.style.display = 'block';

      badge.innerText = '🧠 AIちゃんが考え中…💭';

      let isBanana = false;
      if (net) {
        try {
          const predictions = await net.classify(snapCanvas);
          if (predictions && predictions.length > 0) {
            aiTag.innerText = `🤖 AI判定: ${predictions[0].className} (${(predictions[0].probability * 100).toFixed(1)}%)`;
            isBanana = predictions.some(p => p.className.toLowerCase().includes('banana'));
          }
        } catch (err) {}
      }

      const sx = video.videoWidth * 0.15;
      const sy = video.videoHeight * 0.15;
      const sw = video.videoWidth * 0.7;
      const sh = video.videoHeight * 0.7;
      calcCtx.drawImage(video, sx, sy, sw, sh, 0, 0, 100, 100);
      const data = calcCtx.getImageData(0, 0, 100, 100).data;

      if (currentMode === 'banana') {
        analyzeBanana(data, isBanana);
      } else {
        analyzeOkonomi(data);
      }
    }

    // バナナと点数が画面中を飛び回り、定位置へ吸い込まれる
    function startBouncingPack(displayScore, spokenScore, speechText) {
      flyingScore.innerText = displayScore;
      flyingPack.style.display = 'block';
      staticScore.innerText = '--';

      posX = window.innerWidth / 3;
      posY = window.innerHeight / 3;
      velX = (Math.random() > 0.5 ? 1 : -1) * (6 + Math.random() * 3);
      velY = (Math.random() > 0.5 ? 1 : -1) * (6 + Math.random() * 3);

      function step() {
        posX += velX;
        posY += velY;

        if (scaleGrowing) {
          scale += 0.025;
          if (scale > 1.6) scaleGrowing = false;
        } else {
          scale -= 0.025;
          if (scale < 0.85) scaleGrowing = true;
        }

        const packRect = flyingPack.getBoundingClientRect();
        if (posX <= 0 || posX + packRect.width >= window.innerWidth) {
          velX = -velX;
          posX = Math.max(0, Math.min(posX, window.innerWidth - packRect.width));
        }
        if (posY <= 0 || posY + packRect.height >= window.innerHeight) {
          velY = -velY;
          posY = Math.max(0, Math.min(posY, window.innerHeight - packRect.height));
        }

        flyingPack.style.left = posX + 'px';
        flyingPack.style.top = posY + 'px';
        flyingPack.style.transform = `scale(${scale}) rotate(${(posX % 50) - 25}deg)`;

        bounceAnimId = requestAnimationFrame(step);
      }

      if (bounceAnimId) cancelAnimationFrame(bounceAnimId);
      bounceAnimId = requestAnimationFrame(step);

      // 2.6秒後に定位置へ帰還
      if (bounceTimer) clearTimeout(bounceTimer);
      bounceTimer = setTimeout(() => {
        cancelAnimationFrame(bounceAnimId);
        flyingPack.style.display = 'none';
        staticScore.innerText = displayScore;
        staticScore.style.transform = 'scale(1.3)';
        setTimeout(() => staticScore.style.transform = 'scale(1.0)', 300);

        speakCute(spokenScore, speechText);
      }, 2600);
    }

    function analyzeBanana(data, isBananaByAI) {
      let green = 0, yellow = 0, spot = 0, skin = 0, total = 0;

      for (let i = 0; i < data.length; i += 4) {
        const [h, s, v] = rgbToHsv(data[i], data[i+1], data[i+2]);
        total++;
        if (h >= 5 && h <= 30 && s >= 12 && s <= 45 && v >= 40) skin++;
        else if (h >= 45 && h <= 155 && s > 18 && v > 15) green++;
        else if (h >= 32 && h < 45 && s > 30 && v > 35) yellow++;
        else if (h >= 10 && h < 32 && s > 45 && v >= 15 && v <= 35) spot++;
      }

      if (!isBananaByAI && skin / total > 0.3) {
        const res = pickRandom(DICTIONARY.human);
        badge.innerText = res.badge;
        badge.style.background = '#ffd1d1';
        badge.style.color = '#d32f2f';
        desc.innerText = res.desc;
        startBouncingPack('0.0度', 'れいてんれい ど', res.badge + ' ' + res.desc);
        return;
      }

      const bananaPixels = green + yellow + spot;
      const gRatio = green / (bananaPixels || 1);
      const sRatio = spot / (bananaPixels || 1);

      if (gRatio > 0.10) {
        const rawNum = (7.0 + (1 - gRatio) * 3).toFixed(1);
        const res = pickRandom(DICTIONARY.banana_unripe);
        badge.innerText = res.badge;
        badge.style.background = '#d4edda';
        badge.style.color = '#155724';
        desc.innerText = res.desc;
        startBouncingPack(`${rawNum}度`, `${rawNum} ど`, res.badge + ' ' + res.desc);
      } else if (sRatio > 0.25) {
        const rawNum = (21.0 + Math.min(sRatio, 0.4) * 4).toFixed(1);
        const res = pickRandom(DICTIONARY.banana_ripe);
        badge.innerText = res.badge;
        badge.style.background = '#ffeeba';
        badge.style.color = '#856404';
        desc.innerText = res.desc;
        startBouncingPack(`${rawNum}度`, `${rawNum} ど`, res.badge + ' ' + res.desc);
      } else {
        const rawNum = (14.5 + Math.random() * 2).toFixed(1);
        const res = pickRandom(DICTIONARY.banana_normal);
        badge.innerText = res.badge;
        badge.style.background = '#fff3cd';
        badge.style.color = '#856404';
        desc.innerText = res.desc;
        startBouncingPack(`${rawNum}度`, `${rawNum} ど`, res.badge + ' ' + res.desc);
      }
    }

    function analyzeOkonomi(data) {
      let raw = 0, perfect = 0, burnt = 0, total = 0;
      for (let i = 0; i < data.length; i += 4) {
        const [h, s, v] = rgbToHsv(data[i], data[i+1], data[i+2]);
        total++;
        if (v < 20) burnt++;
        else if (h >= 15 && h <= 45 && s >= 35 && v >= 28) perfect++;
        else if (v > 55 && s < 25) raw++;
      }

      if (burnt / total > 0.2) {
        const res = pickRandom(DICTIONARY.okonomi_burnt);
        badge.innerText = res.badge;
        badge.style.background = '#343a40';
        badge.style.color = '#ff6b6b';
        desc.innerText = res.desc;
        startBouncingPack('4点', 'よんてん', res.badge + ' ' + res.desc);
      } else if (perfect / total > 0.28) {
        const res = pickRandom(DICTIONARY.okonomi_perfect);
        badge.innerText = res.badge;
        badge.style.background = '#d4edda';
        badge.style.color = '#155724';
        desc.innerText = res.desc;
        startBouncingPack('100点', 'ひゃくてん満点', res.badge + ' ' + res.desc);
      } else {
        const res = pickRandom(DICTIONARY.okonomi_raw);
        badge.innerText = res.badge;
        badge.style.background = '#e2e3e5';
        badge.style.color = '#383d41';
        desc.innerText = res.desc;
        startBouncingPack('18点', 'じゅうはちてん', res.badge + ' ' + res.desc);
      }
    }

    function retake() {
      if (bounceAnimId) cancelAnimationFrame(bounceAnimId);
      if (bounceTimer) clearTimeout(bounceTimer);
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();

      flyingPack.style.display = 'none';
      staticScore.innerText = '--';
      video.style.display = 'block';
      snapCanvas.style.display = 'none';
      guide.style.display = 'block';
      mainBtn.style.display = 'block';
      retakeBtn.style.display = 'none';
      badge.innerText = 'ターゲットをうつしてね♡';
      badge.style.background = '#ffe3ee';
      badge.style.color = '#d81b60';
      desc.innerText = '枠のなかにターゲットをドン！とおさえてボタンをおしてね♡';
      aiTag.innerText = '';
    }
  </script>
</body>
</html>
