<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>バナナ熟度チェッカー</title>
  <style>
    body {
      margin: 0;
      background: #121212;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    h2 { margin: 10px 0; font-size: 1.2rem; }
    .camera-container {
      position: relative;
      width: 300px;
      height: 300px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      background: #000;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    canvas { display: none; }
    .guide-box {
      position: absolute;
      top: 20%;
      left: 20%;
      width: 60%;
      height: 60%;
      border: 2px dashed #ffe600;
      border-radius: 12px;
      pointer-events: none;
      box-sizing: border-box;
    }
    .result-card {
      margin-top: 15px;
      width: 280px;
      background: #222;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
    }
    .status {
      font-size: 1.3rem;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .bars {
      font-size: 0.85rem;
      text-align: left;
      line-height: 1.6;
    }
    .btn {
      margin-top: 10px;
      padding: 10px 20px;
      font-size: 1rem;
      font-weight: bold;
      background: #ffe600;
      color: #000;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h2>🍌 バナナ熟度チェッカー</h2>

  <div class="camera-container">
    <video id="video" autoplay playsinline></video>
    <div class="guide-box"></div>
  </div>

  <canvas id="canvas" width="100" height="100"></canvas>

  <div class="result-card">
    <div id="status" class="status">枠内にバナナを映してね</div>
    <div id="bars" class="bars">
      <div>🟢 未熟（青み）: <span id="green-val">0%</span></div>
      <div>🟡 食べ頃（黄色）: <span id="yellow-val">0%</span></div>
      <div>🟤 完熟（茶・斑点）: <span id="brown-val">0%</span></div>
    </div>
  </div>

  <button id="start-btn" class="btn" onclick="startCamera()">カメラを起動</button>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const statusEl = document.getElementById('status');
    const greenEl = document.getElementById('green-val');
    const yellowEl = document.getElementById('yellow-val');
    const brownEl = document.getElementById('brown-val');
    const startBtn = document.getElementById('start-btn');

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" } },
          audio: false
        });
        video.srcObject = stream;
        startBtn.style.display = 'none';
        requestAnimationFrame(analyzeLoop);
      } catch (err) {
        alert('カメラの起動に失敗しました: ' + err.message);
      }
    }

    function rgbToHsv(r, g, b) {
      r /= 255; g /= 255; b /= 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      let h, s, v = max;
      const d = max - min;
      s = max === 0 ? 0 : d / max;
      if (max === min) {
        h = 0;
      } else {
        switch (max) {
          case r: h = (g - b) / d + (g < b ? 6 : 0); break;
          case g: h = (b - r) / d + 2; break;
          case b: h = (r - g) / d + 4; break;
        }
        h /= 6;
      }
      return [h * 360, s * 100, v * 100];
    }

    function analyzeLoop() {
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        // ガイド枠の中心付近をクロップしてサンプリング
        const sx = video.videoWidth * 0.2;
        const sy = video.videoHeight * 0.2;
        const sw = video.videoWidth * 0.6;
        const sh = video.videoHeight * 0.6;

        ctx.drawImage(video, sx, sy, sw, sh, 0, 0, 100, 100);
        const imgData = ctx.getImageData(0, 0, 100, 100).data;

        let greenCount = 0;
        let yellowCount = 0;
        let brownCount = 0;
        let totalBananaPixels = 0;

        for (let i = 0; i < imgData.length; i += 4) {
          const r = imgData[i];
          const g = imgData[i+1];
          const b = imgData[i+2];
          const [h, s, v] = rgbToHsv(r, g, b);

          // バナナ検出（背景除外の簡易フィルタ）
          if (s > 20 && v > 15) {
            // 緑色 (Hue: 65 - 150)
            if (h >= 65 && h <= 150) {
              greenCount++;
              totalBananaPixels++;
            }
            // 黄色 (Hue: 35 - 64)
            else if (h >= 35 && h < 65 && v > 40) {
              yellowCount++;
              totalBananaPixels++;
            }
            // 茶色・シュガースポット (Hue: 10 - 35 または 低明度)
            else if ((h >= 10 && h < 35 && v < 60) || (h < 50 && v < 30)) {
              brownCount++;
              totalBananaPixels++;
            }
          }
        }

        if (totalBananaPixels > 100) {
          const gRatio = Math.round((greenCount / totalBananaPixels) * 100);
          const yRatio = Math.round((yellowCount / totalBananaPixels) * 100);
          const bRatio = Math.round((brownCount / totalBananaPixels) * 100);

          greenEl.innerText = gRatio + '%';
          yellowEl.innerText = yRatio + '%';
          brownEl.innerText = bRatio + '%';

          if (gRatio > 35) {
            statusEl.innerText = 'まだ青い（酸味・デンプン多め）';
            statusEl.style.color = '#76ff03';
          } else if (bRatio > 25) {
            statusEl.innerText = '完熟！甘みMAX（シュガースポット）';
            statusEl.style.color = '#ff9100';
          } else if (yRatio > 40) {
            statusEl.innerText = 'ちょうどいい食べ頃！';
            statusEl.style.color = '#ffd600';
          } else {
            statusEl.innerText = '判定中...';
            statusEl.style.color = '#fff';
          }
        } else {
          statusEl.innerText = '枠内にバナナを収めてね';
          statusEl.style.color = '#888';
        }
      }
      requestAnimationFrame(analyzeLoop);
    }
  </script>
</body>
</html>
