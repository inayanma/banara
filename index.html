    function playBeep(freq, type, duration) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    function rgbToHsv(r, g, b) {
      r /= 255; g /= 255; b /= 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      let h, s, v = max;
      const d = max - min;
      s = max === 0 ? 0 : d / max;
      if (max === min) {
        h = 0;
      } else {
        switch (max) {
          case r: h = (g - b) / d + (g < b ? 6 : 0); break;
          case g: h = (b - r) / d + 2; break;
          case b: h = (r - g) / d + 4; break;
        }
        h /= 6;
      }
      return [h * 360, s * 100, v * 100];
    }

      flyingScore.innerText = displayScore;

      posX = window.innerWidth / 3;
      posY = window.innerHeight / 3;
      velX = (Math.random() > 0.5 ? 1 : -1) * (6 + Math.random() * 3);
      velY = (Math.random() > 0.5 ? 1 : -1) * (6 + Math.random() * 3);

      function step() {
        posX += velX;
        posY += velY;

        if (scaleGrowing) {
          scale += 0.025;
          if (scale > 1.6) scaleGrowing = false;
        } else {
          scale -= 0.025;
          if (scale < 0.85) scaleGrowing = true;
        }

        const packRect = flyingPack.getBoundingClientRect();
        if (posX <= 0 || posX + packRect.width >= window.innerWidth) {
          velX = -velX;
          posX = Math.max(0, Math.min(posX, window.innerWidth - packRect.width));
        }
        if (posY <= 0 || posY + packRect.height >= window.innerHeight) {
          velY = -velY;
          posY = Math.max(0, Math.min(posY, window.innerHeight - packRect.height));
        }

        flyingPack.style.left = posX + 'px';
        flyingPack.style.top = posY + 'px';
        flyingPack.style.transform = `scale(${scale}) rotate(${(posX % 50) - 25}deg)`;

        bounceAnimId = requestAnimationFrame(step);
      }

      if (bounceAnimId) cancelAnimationFrame(bounceAnimId);
      bounceAnimId = requestAnimationFrame(step);

      if (bounceTimer) clearTimeout(bounceTimer);
      bounceTimer = setTimeout(() => {
        cancelAnimationFrame(bounceAnimId);
        flyingPack.style.display = 'none';
        staticScore.innerText = displayScore;

    function computeColorStats(data) {
      let green = 0, yellow = 0, spot = 0, skin = 0, total = 0;
      for (let i = 0; i < data.length; i += 4) {
        const [h, s, v] = rgbToHsv(data[i], data[i+1], data[i+2]);
        total++;
        if (h >= 5 && h <= 30 && s >= 12 && s <= 45 && v >= 40) skin++;
        else if (h >= 45 && h <= 155 && s > 18 && v > 15) green++;
        else if (h >= 32 && h < 45 && s > 30 && v > 35) yellow++;
        else if (h >= 10 && h < 32 && s > 45 && v >= 15 && v <= 35) spot++;
      }
      return {
        green, yellow, spot, skin, total,
        pct: {
          green: (green / total) * 100,
          yellow: (yellow / total) * 100,
          spot: (spot / total) * 100,
          skin: (skin / total) * 100
        }
      };
    }

    function computeScore(stats) {
      const bananaPixels = stats.green + stats.yellow + stats.spot;
      const gRatio = bananaPixels > 0 ? stats.green / bananaPixels : 0;
      const sRatio = bananaPixels > 0 ? stats.spot / bananaPixels : 0;
      const yRatio = bananaPixels > 0 ? stats.yellow / bananaPixels : 0;

      let score = 14.0 - (gRatio * 10) + (yRatio * 3) + (sRatio * 8);
      score = Math.max(0, Math.min(25, score));

      let category;
      if (gRatio > 0.10) category = 'banana_unripe';
      else if (sRatio > 0.25) category = 'banana_ripe';
      else category = 'banana_normal';

      return { score, category, gRatio, sRatio, yRatio };
    }

    async function scouterTick() {
      if (currentMode !== 'scouter' || !cocoModel || video.readyState < 2) return;
      if (video.videoWidth === 0) return;

      scouterTickCount++;
      if (scouterTickCount % 5 === 0) {
        scouterSkin = Math.random() < 0.3 ? 'terminator' : 'dbz';
      }

      scouterCanvas.width = video.videoWidth;
      scouterCanvas.height = video.videoHeight;
      if (!scouterCtx) scouterCtx = scouterCanvas.getContext('2d');
      scouterCtx.clearRect(0, 0, scouterCanvas.width, scouterCanvas.height);

      let predictions = [];
      try {
        predictions = await cocoModel.detect(video);
      } catch (e) { return; }

      const bananas = predictions.filter(p => p.class === 'banana' && p.score > 0.4);

      if (bananas.length === 0) {
        scouterBanner.innerText = '📡 レンズをバナナに向けてね〜（探索中）';
        return;
      }

      const results = bananas.map(b => {
        const [bx, by, bw, bh] = b.bbox;
        const cropCanvas = document.createElement('canvas');
        cropCanvas.width = 40; cropCanvas.height = 40;
        const cropCtx = cropCanvas.getContext('2d', { willReadFrequently: true });
        cropCtx.drawImage(video, bx, by, bw, bh, 0, 0, 40, 40);
        const imgData = cropCtx.getImageData(0, 0, 40, 40).data;
        const stats = computeColorStats(imgData);
        const { score, category } = computeScore(stats);
        return { bbox: b.bbox, score, category };
      });

      let topIdx = 0;
      results.forEach((r, i) => { if (r.score > results[topIdx].score) topIdx = i; });

      results.forEach((r, i) => {
        drawScouterBox(r.bbox, r.score, i === topIdx);
      });

      const top = results[topIdx];
      const categoryLabel = { banana_unripe: 'まだ青い', banana_ripe: '完熟！', banana_normal: 'ふつう' }[top.category] || '';
      if (scouterSkin === 'terminator') {
        scouterBanner.innerText = `🔴 TARGET ACQUIRED — ${bananas.length} SUBJECT(S) — BEST: ${top.score.toFixed(1)}`;
      } else {
        const barometerShort = pickRandom(BAROMETER_NAMES).replace(/^[^\s]+\s/, '');
        scouterBanner.innerText = `📡 ${bananas.length}本検出！一番の${barometerShort}は ${top.score.toFixed(1)}（${categoryLabel}）`;
      }
    }

    function drawScouterBox(bbox, score, isTop) {
      if (scouterSkin === 'terminator') {
        drawTerminatorBox(bbox, score, isTop);
      } else {
        drawDbzBox(bbox, score, isTop);
      }
    }

    function drawDbzBox(bbox, score, isTop) {
      const [x, y, w, h] = bbox;
      const color = isTop ? '#FFD700' : (score > 18 ? '#7CFC00' : score > 10 ? '#FFEB3B' : '#FF6B6B');
      const ctx = scouterCtx;
      const cornerLen = Math.min(w, h) * 0.18;

      ctx.strokeStyle = color;
      ctx.lineWidth = isTop ? 4 : 2.5;
      ctx.shadowColor = color;
      ctx.shadowBlur = isTop ? 12 : 4;

      const corners = [[x, y, 1, 1], [x + w, y, -1, 1], [x, y + h, 1, -1], [x + w, y + h, -1, -1]];
      corners.forEach(([cx, cy, dx, dy]) => {
        ctx.beginPath();
        ctx.moveTo(cx, cy + cornerLen * dy);
        ctx.lineTo(cx);
        ctx.lineTo(cx + cornerLen * dx, cy);
        ctx.stroke();
      });

      ctx.shadowBlur = 0;
      ctx.font = `bold ${Math.max(14, w * 0.09)}px monospace`;
      ctx.fillStyle = color;
      ctx.textBaseline = 'bottom';
      const label = (isTop ? '🎯 ' : '') + '糖度 ' + score.toFixed(1);
      ctx.fillText(label, x, y - 4 > 14 ? y - 4 : y + h + 18);

      if (isTop) {
        ctx.font = `bold ${Math.max(12, w * 0.08)}px sans-serif`;
        ctx.fillText('コレやで!!', x, y + h + (y - 4 > 14 ? 0 : 34));
      }
    }

    function drawTerminatorBox(bbox, score, isTop) {
      const [x, y, w, h] = bbox;
      const ctx = scouterCtx;
      const cx = x + w / 2, cy = y + h / 2;
      const r = Math.max(w, h) / 2 + 6;
      const color = isTop ? '#ff1a1a' : '#ff5c5c';

      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = isTop ? 10 : 3;

      ctx.lineWidth = isTop ? 3 : 2;
      ctx.setLineDash([8, 6]);
      ctx.lineDashOffset = (Date.now() / 30) % 14;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(cx - r - 10, cy); ctx.lineTo(cx - r + 6, cy);
      ctx.moveTo(cx + r - 6, cy); ctx.lineTo(cx + r + 10, cy);
      ctx.moveTo(cx, cy - r - 10); ctx.lineTo(cx, cy - r + 6);
      ctx.moveTo(cx, cy + r - 6); ctx.lineTo(cx, cy + r + 10);
      ctx.stroke();

      ctx.shadowBlur = 0;
      ctx.font = `bold ${Math.max(12, w * 0.08)}px monospace`;
      ctx.textBaseline = 'bottom';
      const label = (isTop ? 'LOCKED ON — ' : 'SCAN — ') + score.toFixed(1);
      ctx.fillText(label, x, y - 6 > 14 ? y - 6 : y + h + r + 16);
    }

    function retake() {
      if (bounceAnimId) cancelAnimationFrame(bounceAnimId);
      if (bounceTimer) clearTimeout(bounceTimer);
      if (gachaInterval) clearInterval(gachaInterval);
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();

      flyingPack.style.display = 'none';
      gachaOverlay.style.display = 'none';
      staticScore.innerText = '--';
      video.style.display = 'block';
      snapCanvas.style.display = 'none';
      guide.style.display = 'block';
      mainBtn.style.display = 'block';
      retakeBtn.style.display = 'none';
      titleBadge.style.display = 'none';
      tauntBubble.style.display = 'none';
      etaBox.style.display = 'none';
      breakdownToggle.style.display = 'none';
      breakdownPanel.style.display = 'none';
      aiThoughtBox.style.display = 'none';
      scoreLabelEl.innerText = '✨ すてーたす';
      badge.innerText = 'バナナちゃんをうつしてね♡';
      badge.style.background = '#ffe3ee';
      badge.style.color = '#d81b60';
      desc.innerText = '枠のなかにバナナちゃんをドン！とおさえてボタンをおしてね♡';
      recipeBox.style.display = 'none';
      faceIcon.innerText = '🍌';
    }
  </script>
