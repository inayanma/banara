<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🍌✨ きゃわわ♡激辛バナナ鑑定所 ✨🍌</title>
  <!-- TensorFlow.js & MobileNet CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@latest"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(circle, #fff0f5 0%, #ffe4ec 50%, #ffd1dc 100%);
      color: #5c3d46;
      font-family: "Hiragino Maru Gothic ProN", "Rounded Mplus 1c", -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
      min-height: 100vh;
      overflow-x: hidden;
    }
    
    .header-area {
      text-align: center;
      margin: 4px 0 8px;
    }
    h1 {
      font-size: 1.3rem;
      margin: 0;
      color: #ff4081;
      text-shadow: 2px 2px 0 #fff;
    }
    .banana-face {
      font-size: 2.2rem;
      display: inline-block;
      margin-top: 2px;
      animation: bounce 1.5s infinite alternate ease-in-out;
    }
    @keyframes bounce {
      0% { transform: translateY(0) rotate(-8deg); }
      100% { transform: translateY(-6px) rotate(8deg) scale(1.1); }
    }

    .camera-wrapper {
      position: relative;
      width: 100%;
      max-width: 320px;
      height: 290px;
      border-radius: 28px;
      overflow: hidden;
      background: #222;
      border: 5px solid #fff;
      box-shadow: 0 8px 24px rgba(255, 105, 180, 0.25);
    }
    video, canvas#snapshot {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .guide-frame {
      position: absolute;
      top: 15%;
      left: 15%;
      width: 70%;
      height: 70%;
      border: 3px dashed #ff8dae;
      border-radius: 20px;
      pointer-events: none;
      box-shadow: inset 0 0 15px rgba(255, 141, 174, 0.4);
    }

    /* 画面中を跳ね回るパック */
    .bouncing-pack {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      display: none;
      white-space: nowrap;
      text-align: center;
    }
    .bouncing-banana {
      font-size: 3.8rem;
      display: block;
      filter: drop-shadow(0 8px 15px rgba(255, 105, 180, 0.6));
    }
    .bouncing-score-text {
      font-size: 3.4rem;
      font-weight: 900;
      color: #ff1493;
      text-shadow: 3px 3px 0 #fff, -3px -3px 0 #fff, 3px -3px 0 #fff, -3px 3px 0 #fff, 0 6px 20px rgba(255, 20, 147, 0.5);
    }

    .card {
      position: relative;
      width: 100%;
      max-width: 320px;
      background: #ffffff;
      border-radius: 24px;
      padding: 14px 16px;
      margin-top: 10px;
      box-shadow: 0 6px 20px rgba(255, 182, 193, 0.3);
      border: 3px solid #fff5f7;
    }
    .score-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 50px;
    }
    .score-label {
      font-size: 0.9rem;
      font-weight: bold;
      color: #a37c86;
    }
    
    .settled-score {
      font-size: 2.8rem;
      font-weight: 900;
      color: #ff2a70;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      text-shadow: 2px 2px 0 #ffe0e9;
    }

    .badge {
      display: inline-block;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 900;
      margin: 6px 0;
      background: #ffe3ee;
      color: #d81b60;
      border: 1px solid #ffccd7;
    }
    .desc {
      font-size: 0.86rem;
      color: #5c3d46;
      line-height: 1.5;
      background: #fff8fa;
      padding: 10px 12px;
      border-radius: 14px;
      border-left: 5px solid #ff8dae;
      font-weight: 700;
    }
    .recipe-box {
      font-size: 0.8rem;
      background: #fff0d4;
      color: #8c5b00;
      padding: 8px 12px;
      border-radius: 12px;
      margin-top: 8px;
      font-weight: 700;
      display: none;
      border: 1px dashed #ffa940;
    }
    .ai-tag {
      font-size: 0.72rem;
      color: #b08d96;
      margin-top: 4px;
    }

    .btn-group {
      margin-top: 10px;
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 320px;
    }
    .action-btn {
      flex: 1;
      padding: 13px;
      font-size: 1.05rem;
      font-weight: 900;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 107, 157, 0.3);
      transition: transform 0.1s;
    }
    .action-btn:active { transform: scale(0.96); }
    .btn-scan {
      background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
      color: #fff;
    }
    .btn-retake {
      background: #f0e6ea;
      color: #6d555c;
      display: none;
    }
  </style>
</head>
<body>

  <div class="header-area">
    <h1>🍌 きゃわわバナナ鑑定所 🍌</h1>
    <div id="face-icon" class="banana-face">🍌</div>
  </div>

  <div class="camera-wrapper">
    <video id="video" autoplay playsinline></video>
    <canvas id="snapshot" style="display: none;"></canvas>
    <div id="guide" class="guide-frame"></div>
  </div>

  <!-- 飛び回るバナナ＆点数パック -->
  <div id="flying-pack" class="bouncing-pack">
    <span id="flying-emoji" class="bouncing-banana">🍌</span>
    <span id="flying-score" class="bouncing-score-text">0.0度</span>
  </div>

  <canvas id="calc-canvas" width="100" height="100" style="display:none;"></canvas>

  <div class="card">
    <div class="score-row">
      <span class="score-label">✨ すてーたす</span>
      <span id="static-score" class="settled-score">--</span>
    </div>
    <div id="badge" class="badge">AIじゅんびちゅう…🎀</div>
    <div id="desc" class="desc">枠のなかにバナナちゃんをドン！とおさえてボタンをおしてね♡</div>
    <div id="recipe-box" class="recipe-box"></div>
    <div id="ai-tag" class="ai-tag"></div>
  </div>

  <div class="btn-group">
    <button id="main-btn" class="action-btn btn-scan" onclick="handleAction()">📸 カメラをつける！</button>
    <button id="retake-btn" class="action-btn btn-retake" onclick="retake()">🔄 もう一回みる♡</button>
  </div>

  <script>
    let stream = null;
    let net = null;
    let bounceAnimId = null;
    let bounceTimer = null;
    let audioCtx = null;

    let posX = 50, posY = 50;
    let velX = 6, velY = 7;
    let scale = 1.0;
    let scaleGrowing = true;

    const video = document.getElementById('video');
    const snapCanvas = document.getElementById('snapshot');
    const calcCanvas = document.getElementById('calc-canvas');
    const calcCtx = calcCanvas.getContext('2d', { willReadFrequently: true });
    const guide = document.getElementById('guide');
    const badge = document.getElementById('badge');
    const desc = document.getElementById('desc');
    const recipeBox = document.getElementById('recipe-box');
    const aiTag = document.getElementById('ai-tag');
    const mainBtn = document.getElementById('main-btn');
    const retakeBtn = document.getElementById('retake-btn');
    const flyingPack = document.getElementById('flying-pack');
    const flyingScore = document.getElementById('flying-score');
    const staticScore = document.getElementById('static-score');
    const faceIcon = document.getElementById('face-icon');

    // レトロピコピコ効果音（Web Audio API）
    function playBeep(freq, type, duration) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    function playBling() {
      playBeep(523, 'sine', 0.1);
      setTimeout(() => playBeep(659, 'sine', 0.1), 100);
      setTimeout(() => playBeep(784, 'sine', 0.2), 200);
    }

    // きゃわわ激辛セリフAI辞書 ＆ 狂気のアレンジガチャ
    const DICTIONARY = {
      human: [
        { badge: '🍖 それ人間の手やろがいっ！', desc: '手や指をみせないで〜！AIちゃんも「それ人間の一部です」ってドン引きしてるよ？', recipe: '💡【救済策】今すぐ高級ハンドクリームを塗りたくって安静にしてください。', face: '😡' },
        { badge: '🖐️ 人肉スキャンはだめ〜！', desc: 'バナナの皮かぶってから出直してきてね♡毛穴しかみえないよ！', recipe: '💡【救済策】手を黄色く塗っても糖度は上がりません。諦めましょう。', face: '💢' }
      ],
      banana_unripe: [
        { badge: '🤮 渋っっ！ガッチガチの草！', desc: '青汁よりしぶ〜い！噛んだ瞬間きゅってなるやつ！ゴリラも窓からポイするレベルだよ！', recipe: '💡【救済策】薄切りにしてフライパンで揚げ焼きにして塩を振れ！ポテチの味になるぞ！', face: '🥶' },
        { badge: '🪵 木片かじってるのぉ？', desc: 'えぐみの暴力〜！お口の水分ぜんぶ持っていかれちゃうよ！3日寝かせてね♡', recipe: '💡【救済策】ラップに包んでレンジで30秒チンして追熟を強引に偽装せよ！', face: '😱' }
      ],
      banana_ripe: [
        { badge: '🍯 蜜のきわみ！自壊寸前っ！', desc: '糖度バクハツ〜！あまあまパラダイス！今すぐおなかにシュートしてぇ！！', recipe: '💡【救済策】牛乳と一緒にミキサーにぶち込んで一気飲みだ！噛む必要すらない！', face: '🤤' },
        { badge: '🔥 かんじゅく神降臨〜✨', desc: 'シュガースポット全開だよ！飲む液体スイーツ！今日ちゅうに食べてね♡', recipe: '💡【救済策】ラップして冷凍庫へ突っ込め！天然の濃厚バナナアイス完成！', face: '😍' }
      ],
      banana_normal: [
        { badge: '🍌 ふつうのバナナちゃん。', desc: 'THE・ひょうじゅん！スーパーのチラシにのってる通りの無難なお味だよ〜。', recipe: '💡【救済策】普通に皮をむいて、普通に食べてください。それが一番です。', face: '🙂' }
      ]
    };

    function pickRandom(list) {
      return list[Math.floor(Math.random() * list.length)];
    }

    // 超高音きゃわわ読み上げ（抑揚と句読点を細かく区切って不自然さを破壊）
    function speakCute(spokenScore, text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();

      // ひらがなで区切り、句読点を多めにして人間味のあるリズムに調教
      const cleanText = text.replace(/[！〜♡✨]/g, '、');
      const utterText = `${spokenScore}。 ${cleanText}`;
      const uttr = new SpeechSynthesisUtterance(utterText);
      uttr.lang = 'ja-JP';
      uttr.rate = 1.25;  // テンポよく
      uttr.pitch = 1.6;  // 超高音アニメボイス

      const voices = window.speechSynthesis.getVoices();
      const cuteVoice = voices.find(v => (v.name.includes('Google') || v.name.includes('Kyoko') || v.name.includes('Otoya') || v.name.includes('Siri') || v.name.includes('Nanami')) && v.lang.includes('ja'));
      if (cuteVoice) uttr.voice = cuteVoice;

      window.speechSynthesis.speak(uttr);
    }

    async function loadAI() {
      try {
        net = await mobilenet.load();
        badge.innerText = 'AIじゅんび完了！カメラつけてね✨';
      } catch (e) {
        badge.innerText = 'AIロード失敗（通常モードで動くよ）';
      }
    }
    loadAI();

    async function handleAction() {
      if (!stream) {
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: "environment" } },
            audio: false
          });
          video.srcObject = stream;
          mainBtn.innerText = '🔍 きゃわわスキャン開始！';
          playBeep(440, 'sine', 0.1);
        } catch (e) {
          alert('カメラ許可エラーだよ: ' + e.message);
        }
      } else {
        runAnalysis();
      }
    }

    function rgbToHsv(r, g, b) {
      r /= 255; g /= 255; b /= 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      let h, s, v = max;
      const d = max - min;
      s = max === 0 ? 0 : d / max;
      if (max === min) {
        h = 0;
      } else {
        switch (max) {
          case r: h = (g - b) / d + (g < b ? 6 : 0); break;
          case g: h = (b - r) / d + 2; break;
          case b: h = (r - g) / d + 4; break;
        }
        h /= 6;
      }
      return [h * 360, s * 100, v * 100];
    }

    async function runAnalysis() {
      playBeep(880, 'square', 0.15);

      snapCanvas.width = video.videoWidth;
      snapCanvas.height = video.videoHeight;
      snapCanvas.getContext('2d').drawImage(video, 0, 0);

      video.style.display = 'none';
      snapCanvas.style.display = 'block';
      guide.style.display = 'none';
      mainBtn.style.display = 'none';
      retakeBtn.style.display = 'block';

      badge.innerText = '🧠 AIちゃんが考え中…💭';

      let isBanana = false;
      if (net) {
        try {
          const predictions = await net.classify(snapCanvas);
          if (predictions && predictions.length > 0) {
            aiTag.innerText = `🤖 AI判定: ${predictions[0].className} (${(predictions[0].probability * 100).toFixed(1)}%)`;
            isBanana = predictions.some(p => p.className.toLowerCase().includes('banana'));
          }
        } catch (err) {}
      }

      const sx = video.videoWidth * 0.15;
      const sy = video.videoHeight * 0.15;
      const sw = video.videoWidth * 0.7;
      const sh = video.videoHeight * 0.7;
      calcCtx.drawImage(video, sx, sy, sw, sh, 0, 0, 100, 100);
      const data = calcCtx.getImageData(0, 0, 100, 100).data;

      analyzeBanana(data, isBanana);
    }

    function startBouncingPack(displayScore, spokenScore, speechText) {
      flyingScore.innerText = displayScore;
      flyingPack.style.display = 'block';
      staticScore.innerText = '--';

      posX = window.innerWidth / 3;
      posY = window.innerHeight / 3;
      velX = (Math.random() > 0.5 ? 1 : -1) * (6 + Math.random() * 3);
      velY = (Math.random() > 0.5 ? 1 : -1) * (6 + Math.random() * 3);

      function step() {
        posX += velX;
        posY += velY;

        if (scaleGrowing) {
          scale += 0.025;
          if (scale > 1.6) scaleGrowing = false;
        } else {
          scale -= 0.025;
          if (scale < 0.85) scaleGrowing = true;
        }

        const packRect = flyingPack.getBoundingClientRect();
        if (posX <= 0 || posX + packRect.width >= window.innerWidth) {
          velX = -velX;
          posX = Math.max(0, Math.min(posX, window.innerWidth - packRect.width));
        }
        if (posY <= 0 || posY + packRect.height >= window.innerHeight) {
          velY = -velY;
          posY = Math.max(0, Math.min(posY, window.innerHeight - packRect.height));
        }

        flyingPack.style.left = posX + 'px';
        flyingPack.style.top = posY + 'px';
        flyingPack.style.transform = `scale(${scale}) rotate(${(posX % 50) - 25}deg)`;

        bounceAnimId = requestAnimationFrame(step);
      }

      if (bounceAnimId) cancelAnimationFrame(bounceAnimId);
      bounceAnimId = requestAnimationFrame(step);

      if (bounceTimer) clearTimeout(bounceTimer);
      bounceTimer = setTimeout(() => {
        cancelAnimationFrame(bounceAnimId);
        flyingPack.style.display = 'none';
        staticScore.innerText = displayScore;
        staticScore.style.transform = 'scale(1.3)';
        setTimeout(() => staticScore.style.transform = 'scale(1.0)', 300);

        playBling();
        speakCute(spokenScore, speechText);
      }, 2400);
    }

    function analyzeBanana(data, isBananaByAI) {
      let green = 0, yellow = 0, spot = 0, skin = 0, total = 0;

      for (let i = 0; i < data.length; i += 4) {
        const [h, s, v] = rgbToHsv(data[i], data[i+1], data[i+2]);
        total++;
        if (h >= 5 && h <= 30 && s >= 12 && s <= 45 && v >= 40) skin++;
        else if (h >= 45 && h <= 155 && s > 18 && v > 15) green++;
        else if (h >= 32 && h < 45 && s > 30 && v > 35) yellow++;
        else if (h >= 10 && h < 32 && s > 45 && v >= 15 && v <= 35) spot++;
      }

      if (!isBananaByAI && skin / total > 0.3) {
        const res = pickRandom(DICTIONARY.human);
        badge.innerText = res.badge;
        badge.style.background = '#ffd1d1';
        badge.style.color = '#d32f2f';
        desc.innerText = res.desc;
        recipeBox.innerText = res.recipe;
        recipeBox.style.display = 'block';
        faceIcon.innerText = res.face;
        startBouncingPack('0.0度', 'とうど、れいてんれい ど', res.badge + '、' + res.desc);
        return;
      }

      const bananaPixels = green + yellow + spot;
      const gRatio = green / (bananaPixels || 1);
      const sRatio = spot / (bananaPixels || 1);

      if (gRatio > 0.10) {
        const rawNum = (7.0 + (1 - gRatio) * 3).toFixed(1);
        const res = pickRandom(DICTIONARY.banana_unripe);
        badge.innerText = res.badge;
        badge.style.background = '#d4edda';
        badge.style.color = '#155724';
        desc.innerText = res.desc;
        recipeBox.innerText = res.recipe;
        recipeBox.style.display = 'block';
        faceIcon.innerText = res.face;
        startBouncingPack(`${rawNum}度`, `とうど、${rawNum} ど`, res.badge + '、' + res.desc);
      } else if (sRatio > 0.25) {
        const rawNum = (21.0 + Math.min(sRatio, 0.4) * 4).toFixed(1);
        const res = pickRandom(DICTIONARY.banana_ripe);
        badge.innerText = res.badge;
        badge.style.background = '#ffeeba';
        badge.style.color = '#856404';
        desc.innerText = res.desc;
        recipeBox.innerText = res.recipe;
        recipeBox.style.display = 'block';
        faceIcon.innerText = res.face;
        startBouncingPack(`${rawNum}度`, `とうど、${rawNum} ど`, res.badge + '、' + res.desc);
      } else {
        const rawNum = (14.5 + Math.random() * 2).toFixed(1);
        const res = pickRandom(DICTIONARY.banana_normal);
        badge.innerText = res.badge;
        badge.style.background = '#fff3cd';
        badge.style.color = '#856404';
        desc.innerText = res.desc;
        recipeBox.innerText = res.recipe;
        recipeBox.style.display = 'block';
        faceIcon.innerText = res.face;
        startBouncingPack(`${rawNum}度`, `とうど、${rawNum} ど`, res.badge + '、' + res.desc);
      }
    }

    function retake() {
      if (bounceAnimId) cancelAnimationFrame(bounceAnimId);
      if (bounceTimer) clearTimeout(bounceTimer);
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();

      flyingPack.style.display = 'none';
      staticScore.innerText = '--';
      video.style.display = 'block';
      snapCanvas.style.display = 'none';
      guide.style.display = 'block';
      mainBtn.style.display = 'block';
      retakeBtn.style.display = 'none';
      badge.innerText = 'バナナちゃんをうつしてね♡';
      badge.style.background = '#ffe3ee';
      badge.style.color = '#d81b60';
      desc.innerText = '枠のなかにバナナちゃんをドン！とおさえてボタンをおしてね♡';
      recipeBox.style.display = 'none';
      aiTag.innerText = '';
      faceIcon.innerText = '🍌';
    }
  </script>
</body>
</html>
